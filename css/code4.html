<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      nav {
        padding: 20px;

        color: white;
        padding-bottom: 40px;
      }
      .logo {

      }

    <nav>
      <div class="logo">logo</div>
      <ul>
        <li>Home</li>

      </ul>

</html>
