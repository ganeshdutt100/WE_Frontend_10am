<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table border="1">
      <caption>
        Table
      </caption>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
        <th>Country</th>
      </tr>
      <tr>
        <td>Rahul</td>
        <td>25</td>
        <td>Delhi</td>
        <td rowspan="5">India</td>
      </tr>
      <tr>
        <td>Rahul</td>
        <td>25</td>
        <td>Delhi</td>
        <!-- <td>India</td> -->
      </tr>
      <tr>
        <td>Rahul</td>
        <td>25</td>
        <td>Delhi</td>
      </tr>
      <tr>
        <td>Rahul</td>
        <td>25</td>
        <td>Delhi</td>
      </tr>
      <tr>
        <td colspan="3">Rahul</td>
      </tr>
    </table>
  </body>
</html>
